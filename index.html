<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Своя Игра — Для Мамы</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: #000c24; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; padding: 12px; }

    /* Шапка */
    header { display: flex; justify-content: space-between; align-items: center; background: #001f54; padding: 12px 18px; border-radius: 10px; border: 2px solid #0a4da2; margin-bottom: 14px; flex-wrap: wrap; gap: 10px; }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .game-logo { font-size: 1.4rem; font-weight: 900; color: #ffc300; letter-spacing: 1px; }
    .round-indicator { background: #ffc300; color: #000814; font-weight: 900; padding: 4px 12px; border-radius: 6px; font-size: 1.1rem; text-transform: uppercase; }

    .btn { background: #ffc300; color: #000; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 800; cursor: pointer; transition: 0.15s; font-size: 0.95rem; }
    .btn:hover { background: #ffd60a; transform: translateY(-1px); }
    .btn-blue { background: #0a4da2; color: #fff; }
    .btn-red { background: #d90429; color: #fff; }
    .btn-green { background: #2a9d8f; color: #fff; }
    .btn:disabled { opacity: 0.3; cursor: not-allowed; }

    /* Табло игры */
    #game-screen { flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; gap: 14px; }
    .board-grid { display: flex; flex-direction: column; gap: 8px; max-width: 1300px; width: 100%; margin: 0 auto; }
    
    .row-category { display: grid; grid-template-columns: 240px repeat(5, 1fr); gap: 8px; }
    .cat-name-cell { background: #001a4d; border: 2px solid #00509d; border-radius: 8px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 10px; font-weight: 800; font-size: 1.1rem; text-transform: uppercase; color: #e0eaff; line-height: 1.2; }
    
    .cost-tile { background: #00296b; border: 2px solid #00509d; border-radius: 8px; min-height: 70px; display: flex; align-items: center; justify-content: center; font-size: 1.9rem; font-weight: 900; color: #ffc300; cursor: pointer; transition: 0.15s; user-select: none; }
    .cost-tile:hover { background: #003f88; border-color: #ffc300; transform: scale(1.02); }
    .cost-tile.played { opacity: 0.15; cursor: not-allowed; background: #000814; border-color: transparent; }

    /* Переключение раундов */
    .round-stepper { display: flex; justify-content: center; gap: 12px; margin: 8px 0; }

    /* Панель команд */
    .teams-container { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; padding-top: 6px; }
    .team-box { background: #001433; border: 2px solid #003f88; border-radius: 8px; padding: 10px 18px; min-width: 150px; text-align: center; }
    .team-box .t-name { font-size: 1rem; color: #a2d2ff; font-weight: 700; }
    .team-box .t-score { font-size: 1.6rem; color: #ffc300; font-weight: 900; margin-top: 2px; }

    /* Всплывающий экран вопроса */
    #question-overlay { display: none; position: fixed; inset: 0; background: rgba(0, 8, 20, 0.97); z-index: 1000; flex-direction: column; padding: 20px; align-items: center; justify-content: center; text-align: center; }
    #question-overlay.open { display: flex; }
    .q-wrap { max-width: 950px; width: 100%; display: flex; flex-direction: column; gap: 16px; align-items: center; }
    .q-cost-banner { font-size: 2.5rem; font-weight: 900; color: #ffc300; }
    .q-body-text { font-size: 2rem; font-weight: 700; line-height: 1.35; color: #ffffff; }

    .q-media-container { max-height: 42vh; max-width: 100%; border-radius: 10px; overflow: hidden; margin: 4px 0; }
    .q-media-container img, .q-media-container video { max-height: 42vh; max-width: 100%; object-fit: contain; border-radius: 8px; }

    /* Блок начисления баллов */
    .action-panel { background: #001a4d; border: 2px solid #00509d; border-radius: 10px; padding: 14px; width: 100%; display: flex; flex-direction: column; gap: 10px; }
    .team-btn-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .team-pick-button { background: #00296b; border: 2px solid #00509d; color: #fff; padding: 10px 18px; border-radius: 8px; font-weight: 800; font-size: 1.1rem; cursor: pointer; }
    .team-pick-button.active { background: #ffc300; color: #000; border-color: #fff; }
    .team-pick-button:disabled { opacity: 0.25; cursor: not-allowed; text-decoration: line-through; }

    .verdict-row { display: flex; gap: 12px; justify-content: center; }
    
    .answer-card { display: none; background: #00296b; padding: 14px; border-radius: 8px; border: 2px dashed #ffc300; width: 100%; }
    .answer-card.visible { display: block; }

    /* Окно Редактора */
    #editor-screen { display: none; flex-direction: column; gap: 16px; max-width: 1000px; margin: 0 auto; width: 100%; padding-bottom: 50px; }
    .edit-block { background: #001a4d; border: 2px solid #00509d; border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .q-edit-box { background: #00296b; padding: 12px; border-radius: 8px; border-left: 4px solid #ffc300; display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
    .field-row { display: grid; grid-template-columns: 85px 1fr; gap: 8px; align-items: center; }
    .field-row label { font-size: 0.85rem; color: #a2d2ff; font-weight: 700; }
    input, select { background: #000d24; border: 1px solid #00509d; color: #fff; padding: 9px 12px; border-radius: 6px; font-size: 0.95rem; width: 100%; }

    @media (max-width: 850px) {
      .row-category { grid-template-columns: 140px repeat(5, 1fr); gap: 4px; }
      .cat-name-cell { font-size: 0.8rem; padding: 6px; }
      .cost-tile { font-size: 1.1rem; min-height: 50px; }
      .q-body-text { font-size: 1.3rem; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <span class="game-logo">СВОЯ ИГРА 💖</span>
      <span class="round-indicator" id="ui-round-title">Раунд 1</span>
    </div>
    <div style="display: flex; gap: 8px;">
      <button class="btn btn-blue" onclick="openEditor()">⚙️ Редактор вопросов</button>
      <button class="btn btn-red" onclick="resetAllProgress()">🔄 Сброс очков</button>
    </div>
  </header>

  <!-- Экран табло -->
  <main id="game-screen">
    <div class="board-grid" id="board-container"></div>
    <div class="round-stepper" id="stepper-controls"></div>
    <div class="teams-container" id="teams-container"></div>
  </main>

  <!-- Окно вопроса -->
  <div id="question-overlay">
    <div class="q-wrap">
      <div class="q-cost-banner" id="view-q-cost">100</div>
      <div class="q-body-text" id="view-q-text">Текст вопроса</div>
      <div class="q-media-container" id="view-q-media"></div>
