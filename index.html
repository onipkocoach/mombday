<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Своя Игра</title>
  <style>
    :root {
      --sv-blue: #001f5c;
      --sv-dark: #000c24;
      --sv-tile: #0a2f87;
      --sv-gold: #ffcc00;
      --sv-gold-hover: #ffe066;
      --sv-border: #1a4ab8;
      --danger: #d90429;
      --success: #008000;
      --text: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Arial Black', Impact, -apple-system, sans-serif; }
    body { background: var(--sv-dark); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; padding: 8px; }

    .btn { background: var(--sv-gold); color: #000; border: 2px solid #fff; border-radius: 6px; padding: 8px 14px; font-size: 0.95rem; font-weight: 900; cursor: pointer; text-transform: uppercase; transition: transform 0.1s; }
    .btn:hover { background: var(--sv-gold-hover); transform: scale(1.02); }
    .btn-blue { background: #1a4ab8; color: #fff; border-color: var(--sv-gold); }
    .btn-red { background: var(--danger); color: #fff; border-color: #fff; }
    .btn-green { background: var(--success); color: #fff; border-color: #fff; }
    .btn:disabled { opacity: 0.25; cursor: not-allowed; }

    .screen { display: none; width: 100%; flex-direction: column; flex-grow: 1; }
    .screen.active-screen { display: flex !important; }

    /* Главное меню */
    #view-main-menu { align-items: center; justify-content: center; gap: 20px; text-align: center; }
    .menu-title { font-size: 2.8rem; color: var(--sv-gold); text-shadow: 3px 3px 6px #000; text-transform: uppercase; }
    .menu-box { display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 360px; }
    .menu-btn { font-size: 1.3rem; padding: 18px; border-radius: 10px; }

    /* Лобби */
    #view-lobby { align-items: center; justify-content: center; max-width: 650px; margin: 0 auto; }
    .lobby-card { background: var(--sv-blue); border: 2px solid var(--sv-gold); border-radius: 10px; padding: 18px; width: 100%; display: flex; flex-direction: column; gap: 14px; }

    /* Игровое табло */
    #view-game { justify-content: space-between; gap: 8px; }
    header { display: flex; justify-content: space-between; align-items: center; background: var(--sv-blue); border: 2px solid var(--sv-gold); border-radius: 8px; padding: 8px 14px; }
    .round-title { font-size: 1.3rem; color: var(--sv-gold); }
    
    .board-scroll-wrap { overflow-x: auto; width: 100%; padding-bottom: 6px; }
    #board-table { display: flex; flex-direction: column; gap: 6px; min-width: 640px; }
    .board-row { display: flex; gap: 6px; width: 100%; }
    .theme-cell { background: var(--sv-blue); border: 2px solid var(--sv-gold); border-radius: 6px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 6px; font-size: 0.95rem; color: #fff; text-transform: uppercase; width: 180px; flex-shrink: 0; }
    .price-cell { background: var(--sv-tile); border: 2px solid var(--sv-gold); border-radius: 6px; height: 58px; flex: 1; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; color: var(--sv-gold); cursor: pointer; text-shadow: 2px 2px 4px #000; flex-shrink: 0; min-width: 70px; }
    .price-cell:hover { background: #1342b3; }
    .price-cell.empty { background: #000814; border-color: #0b1d40; color: transparent; pointer-events: none; }

    #teams-bar { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 6px; }
    .team-card { background: var(--sv-blue); border: 2px solid var(--sv-gold); border-radius: 6px; padding: 6px 14px; min-width: 140px; text-align: center; cursor: pointer; transition: transform 0.1s; }
    .team-card:hover { transform: scale(1.03); background: #0b2b78; }
    .team-name { font-size: 0.9rem; }
    .team-score { font-size: 1.5rem; color: var(--sv-gold); }

    /* Модальное окно вопроса */
    #modal-question { display: none; position: fixed; inset: 0; background: var(--sv-dark); z-index: 1000; flex-direction: column; padding: 14px; align-items: center; justify-content: space-between; border: 4px solid var(--sv-gold); overflow-y: auto; }
    #modal-question.active { display: flex; }
    .q-cost { font-size: 2rem; color: var(--sv-gold); }
    .q-body { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; max-width: 1100px; text-align: center; gap: 12px; }
    .q-text { font-size: 1.8rem; line-height: 1.3; font-family: Arial, sans-serif; font-weight: bold; }
    .media-holder { max-height: 40vh; max-width: 100%; display: flex; justify-content: center; }
    .media-holder img, .media-holder video { max-height: 40vh; max-width: 100%; border: 3px solid var(--sv-gold); border-radius: 8px; }
    .answer-box { display: none; background: #002878; border: 2px dashed var(--sv-gold); border-radius: 8px; padding: 12px 18px; width: 100%; }
    .answer-box.active { display: block; }

    .q-controls { background: var(--sv-blue); border: 2px solid var(--sv-border); border-radius: 8px; padding: 10px; width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 8px; align-items: center; }
    .players-list { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .player-btn { background: #0a2f87; color: #fff; border: 2px solid var(--sv-gold); padding: 8px 14px; border-radius: 6px; font-size: 0.95rem; cursor: pointer; }
    .player-btn.selected { background: var(--sv-gold); color: #000; }
    .player-btn:disabled { opacity: 0.2; text-decoration: line-through; cursor: not-allowed; }

    /* Окно ручного изменения очков команды */
    #modal-score-edit { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1500; align-items: center; justify-content: center; padding: 16px; }
    #modal-score-edit.active { display: flex; }
    .score-edit-card { background: var(--sv-blue); border: 2px solid var(--sv-gold); border-radius: 8px; padding: 20px; width: 100%; max-width: 400px; text-align: center; display: flex; flex-direction: column; gap: 12px; }

    /* Редактор */
    #view-editor { max-width: 1000px; margin: 0 auto; gap: 14px; padding-bottom: 50px; }
    .editor-header { display: flex; justify-content: space-between; align-items: center; background: var(--sv-blue); padding: 10px 14px; border-radius: 8px; border: 2px solid var(--sv-gold); flex-wrap: wrap; gap: 8px; }
    .theme-accordion-box { background: #09173b; border: 1px solid var(--sv-gold); border-radius: 6px; padding: 10px; margin-top: 8px; display: flex; flex-direction: column; gap: 8px; }
    .theme-header-row { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
    .q-edit-box { background: #050d24; border-left: 4px solid var(--sv-gold); padding: 8px; border-radius: 4px; display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
    
    .row-input { display: grid; grid-template-columns: 140px 1fr; gap: 6px; align-items: center; }
    .row-input label { font-size: 0.85rem; color: var(--sv-gold); font-family: Arial, sans-serif; font-weight: bold; }
    input, select { background: #000c24; border: 1px solid var(--sv-border); color: #fff; padding: 8px; border-radius: 4px; font-size: 0.95rem; font-family: Arial, sans-serif; }

    @media (max-width: 600px) {
      .row-input { grid-template-columns: 1fr; }
      .q-text { font-size: 1.3rem; }
    }
  </style>
</head>
<body>

  <!-- 1. ГЛАВНОЕ МЕНЮ -->
  <section id="view-main-menu" class="screen active-screen">
    <h1 class="menu-title">Своя Игра 💖</h1>
    <div class="menu-box">
      <button class="btn menu-btn" onclick="goToLobby()">🎮 Играть</button>
      <button class="btn btn-blue menu-btn" onclick="goToEditor()">⚙️ Редактор пака</button>
    </div>
  </section>

  <!-- 2. ЛОББИ -->
  <section id="view-lobby" class="screen">
    <div class="lobby-card">
      <h2 style="color:var(--sv-gold); text-align:center;">НАСТРОЙКА ИГРЫ</h2>
      
      <div>
        <label style="font-size:0.95rem; color:var(--sv-gold); display:block; margin-bottom:6px;">1. Файл игры (.json):</label>
        <input type="file" id="lobby-file-input" accept=".json" style="width:100%; cursor:pointer;">
        <div style="margin-top:6px; font-size:0.85rem; color:#a8dadc;" id="pack-status-label">Используется текущий пак из памяти браузера</div>
      </div>

      <div>
        <label style="font-size:0.95rem; color:var(--sv-gold); display:block; margin-bottom:6px;">2. Команды:</label>
        <div style="display:flex; gap:8px;">
          <input type="text" id="lobby-team-input" placeholder="Название команды" style="flex-grow:1;">
          <button class="btn" onclick="addTeam()">Добавить</button>
        </div>
        <div id="lobby-teams-list" style="display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;"></div>
      </div>

      <div style="display:flex; gap:10px; margin-top:10px;">
        <button class="btn btn-green" onclick="launchGame()" style="flex-grow:1; padding:12px; font-size:1.1rem;">🚀 НАЧАТЬ ИГРУ</button>
        <button class="btn btn-red" onclick="goToMenu()">Назад</button>
      </div>
    </div>
  </section>

  <!-- 3. ЭКРАН ИГРЫ -->
  <section id="view-game" class="screen">
    <header>
      <div class="round-title" id="game-round-title">РАУНД 1</div>
      <div style="display:flex; gap:8px;">
        <button class="btn btn-blue" id="btn-next-round" onclick="nextRound()">Следующий раунд ➡️</button>
        <button class="btn btn-red" onclick="exitToMenu()">Выход</button>
      </div>
    </header>

    <div class="board-scroll-wrap">
      <div id="board-table"></div>
    </div>

    <div>
      <div style="font-size:0.75rem; text-align:center; color:#94a3b8; margin-bottom:4px;">💡 Нажмите на команду для ручного изменения очков (ставки/штрафы)</div>
      <div id="teams-bar"></div>
    </div>
  </section>

  <!-- МОДАЛЬНОЕ ОКНО ВОПРОСА -->
  <div id="modal-question">
    <div class="q-cost" id="q-cost-display">100 БАЛЛОВ</div>

    <div class="q-body">
      <div class="q-text" id="q-text-display">Вопрос</div>
      <div class="media-holder" id="q-media-box"></div>

      <div class="answer-box" id="q-answer-box">
        <div style="color:var(--sv-gold); font-size:1.1rem; margin-bottom:4px;">ПРАВИЛЬНЫЙ ОТВЕТ:</div>
        <div style="font-size:1.6rem; font-family:Arial,sans-serif;" id="q-answer-text">Ответ</div>
        <div class="media-holder" id="a-media-box" style="margin-top:8px;"></div>
      </div>
    </div>

    <div class="q-controls">
      <div id="answering-team-label" style="font-size:0.9rem; color:var(--sv-gold);">КТО ОТВЕЧАЕТ:</div>
      <div class="players-list" id="modal-players-list"></div>

      <div id="modal-verdict-box" style="display:none; gap:10px; margin-top:6px;">
        <button class="btn btn-green" onclick="judgeAnswer(true)">✅ ВЕРНО (+БАЛЛЫ)</button>
        <button class="btn btn-red" onclick="judgeAnswer(false)">❌ НЕВЕРНО (-БАЛЛЫ)</button>
      </div>

      <div style="display:flex; gap:8px; margin-top:6px; flex-wrap:wrap; justify-content:center;">
        <button class="btn btn-blue" onclick="revealAnswer()">👀 ОТВЕТ</button>
        <button class="btn" id="btn-skip" onclick="passQuestion()">⏭️ ПРОПУСК</button>
        <button class="btn btn-blue" onclick="closeQuestion()">ЗАКРЫТЬ ВОПРОС</button>
      </div>
    </div>
  </div>

  <!-- ОКНО ИЗМЕНЕНИЯ СЧЁТА КОМАНДЫ ВРУЧНУЮ -->
  <div id="modal-score-edit">
    <div class="score-edit-card">
      <h3 style="color:var(--sv-gold);" id="edit-score-team-name">Команда</h3>
      <div style="font-size:0.9rem; color:#cbd5e1;">Текущий счёт: <span id="edit-score-current-val" style="font-size:1.2rem; color:var(--sv-gold); font-weight:bold;">0</span></div>
      
      <input type="number" id="manual-score-input" placeholder="Количество очков (напр. 500)">

      <div style="display:flex; gap:8px;">
        <button class="btn btn-green" style="flex:1;" onclick="applyManualScore(true)">➕ Добавить</button>
        <button class="btn btn-red" style="flex:1;" onclick="applyManualScore(false)">➖ Снять</button>
      </div>
      <button class="btn btn-blue" onclick="closeManualScoreModal()">Закрыть</button>
    </div>
  </div>

  <!-- 4. РЕДАКТОР С АККОРДЕОНОМ -->
  <section id="view-editor" class="screen">
    <div class="editor-header">
      <h2 style="color:var(--sv-gold);">Редактор пака</h2>
      <div style="display:flex; gap:6px; flex-wrap:wrap;">
        <button class="btn btn-green" onclick="exportPackFile()">💾 Скачать .json</button>
        <button class="btn btn-blue" onclick="saveEditorLocally()">Сохранить</button>
        <button class="btn btn-red" onclick="goToMenu()">В меню</button>
      </div>
    </div>

    <!-- Выбор редактируемого раунда -->
    <div style="background:#09173b; padding:10px; border-radius:6px; border:1px solid var(--sv-border); display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
      <div style="display:flex; align-items:center; gap:8px;">
        <label style="color:var(--sv-gold); font-size:0.9rem;">РАУНД:</label>
        <select id="editor-active-round-select" onchange="switchEditorRound(this.value)"></select>
      </div>
      <div style="display:flex; gap:6px;">
        <button class="btn" onclick="addRoundToEditor()">➕ Добавить раунд</button>
        <button class="btn btn-red" onclick="removeCurrentEditorRound()">Удалить раунд</button>
      </div>
    </div>

    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:4px;">
      <button class="btn btn-blue" onclick="addThemeToEditor()">➕ Добавить тему в этот раунд</button>
    </div>

    <div id="editor-themes-container"></div>
  </section>

  <script>
    let gamePack = { rounds: [] };
    let gameTeams = [];
    let currentRoundIdx = 0;
    let editorRoundIdx = 0;
    let playedQuestions = [];
    let activeQuestionCost = 0;
    let selectedTeamIdx = null;
    let lockedTeams = [];
    let manualEditTeamIdx = null;

    // Свернутые темы в редакторе (аккордеон)
    let collapsedThemes = {};

    window.addEventListener('DOMContentLoaded', () => {
      const saved = localStorage.getItem('svoyak_v7_pack');
      if (saved) {
        try { gamePack = JSON.parse(saved); } catch(e){}
      }
      const savedTeams = localStorage.getItem('svoyak_v7_teams');
      if (savedTeams) {
        try { gameTeams = JSON.parse(savedTeams); } catch(e){}
      }
      renderLobbyTeams();
    });

    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
      const target = document.getElementById(screenId);
      if (target) target.classList.add('active-screen');
    }

    function goToMenu() { showScreen('view-main-menu'); }
    function goToLobby() { showScreen('view-lobby'); renderLobbyTeams(); }
    function goToEditor() { showScreen('view-editor'); updateEditorRoundSelect(); renderEditorActiveRound(); }

    /* ЛОББИ КОМАНД */
    function renderLobbyTeams() {
      const list = document.getElementById('lobby-teams-list');
      list.innerHTML = '';
      gameTeams.forEach((t, idx) => {
        const item = document.createElement('span');
        item.style.background = '#0a2f87';
        item.style.border = '1px solid var(--sv-gold)';
        item.style.padding = '4px 10px';
        item.style.borderRadius = '4px';
        item.innerHTML = `${t.name} <b style="color:red; cursor:pointer; margin-left:6px;" onclick="removeTeam(${idx})">&times;</b>`;
        list.appendChild(item);
      });
    }

    function addTeam() {
      const inp = document.getElementById('lobby-team-input');
      const val = inp.value.trim();
      if (!val) return;
      gameTeams.push({ name: val, score: 0 });
      inp.value = '';
      localStorage.setItem('svoyak_v7_teams', JSON.stringify(gameTeams));
      renderLobbyTeams();
    }

    function removeTeam(idx) {
      gameTeams.splice(idx, 1);
      localStorage.setItem('svoyak_v7_teams', JSON.stringify(gameTeams));
      renderLobbyTeams();
    }

    document.getElementById('lobby-file-input').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const loaded = JSON.parse(evt.target.result);
          if (loaded.rounds && Array.isArray(loaded.rounds)) {
            gamePack = loaded;
            localStorage.setItem('svoyak_v7_pack', JSON.stringify(gamePack));
            document.getElementById('pack-status-label').innerText = `✅ Загружен пак: "${file.name}" (${gamePack.rounds.length} раунд.)`;
          }
        } catch(err) {
          alert('Ошибка чтения файла .json');
        }
      };
      reader.readAsText(file);
    });

    function launchGame() {
      if (!gamePack.rounds || gamePack.rounds.length === 0) {
        alert("В паке нет раундов! Сначала откройте Редактор и создайте вопросы.");
        return;
      }
      if (gameTeams.length === 0) {
        alert("Добавьте хотя бы одну команду!");
        return;
      }

      currentRoundIdx = 0;
      playedQuestions = [];
      gameTeams.forEach(t => t.score = 0);
      showScreen('view-game');
      renderGameBoard();
      renderGameTeams();
    }

    /* ТАБЛО ИГРЫ */
    function renderGameBoard() {
      const table = document.getElementById('board-table');
      table.innerHTML = '';

      const round = gamePack.rounds[currentRoundIdx];
      if (!round) return;

      document.getElementById('game-round-title').innerText = round.name;

      round.themes.forEach((theme, tIdx) => {
        const row = document.createElement('div');
        row.className = 'board-row';

        const tCell = document.createElement('div');
        tCell.className = 'theme-cell';
        tCell.innerText = theme.name;
        row.appendChild(tCell);

        theme.questions.forEach((q, qIdx) => {
          const qCell = document.createElement('div');
          const qKey = `r${currentRoundIdx}_t${tIdx}_q${qIdx}`;
          const isPlayed = playedQuestions.includes(qKey);

          qCell.className = 'price-cell' + (isPlayed ? ' empty' : '');
          qCell.innerText = isPlayed ? '' : q.cost;

          if (!isPlayed) {
            qCell.onclick = () => openQuestion(tIdx, qIdx, qKey);
          }
          row.appendChild(qCell);
        });

        table.appendChild(row);
      });

      const nextBtn = document.getElementById('btn-next-round');
      if (currentRoundIdx < gamePack.rounds.length - 1) {
        nextBtn.style.display = 'block';
        nextBtn.innerText = `Перейти: ${gamePack.rounds[currentRoundIdx + 1].name} ➡️`;
      } else {
        nextBtn.style.display = 'none';
      }
    }

    function nextRound() {
      if (currentRoundIdx < gamePack.rounds.length - 1) {
        currentRoundIdx++;
        renderGameBoard();
      }
    }

    function renderGameTeams() {
      const bar = document.getElementById('teams-bar');
      bar.innerHTML = '';
      gameTeams.forEach((t, idx) => {
        const c = document.createElement('div');
        c.className = 'team-card';
        c.innerHTML = `<div class="team-name">${t.name}</div><div class="team-score">${t.score}</div>`;
        c.onclick = () => openManualScoreModal(idx);
        bar.appendChild(c);
      });
    }

    /* РУЧНОЕ ИЗМЕНЕНИЕ БАЛЛОВ КОМАНДЫ (СТАВКИ) */
    function openManualScoreModal(idx) {
      manualEditTeamIdx = idx;
      const t = gameTeams[idx];
      document.getElementById('edit-score-team-name').innerText = t.name;
      document.getElementById('edit-score-current-val').innerText = t.score;
      document.getElementById('manual-score-input').value = '';
      document.getElementById('modal-score-edit').classList.add('active');
    }

    function closeManualScoreModal() {
      document.getElementById('modal-score-edit').classList.remove('active');
    }

    function applyManualScore(isAdd) {
      if (manualEditTeamIdx === null) return;
      const val = parseInt(document.getElementById('manual-score-input').value);
      if (isNaN(val)) return;

      if (isAdd) {
        gameTeams[manualEditTeamIdx].score += val;
      } else {
        gameTeams[manualEditTeamIdx].score -= val;
      }
      renderGameTeams();
      closeManualScoreModal();
    }

    function exitToMenu() {
      if (confirm("Выйти в меню? Игра завершится.")) {
        goToMenu();
      }
    }

    /* ВОПРОС */
    function openQuestion(tIdx, qIdx, qKey) {
      const q = gamePack.rounds[currentRoundIdx].themes[tIdx].questions[qIdx];
      activeQuestionCost = q.cost;
      selectedTeamIdx = null;
      lockedTeams = [];

      document.getElementById('q-cost-display').innerText = `${q.cost} БАЛЛОВ`;
      document.getElementById('q-text-display').innerText = q.text;

      renderMedia(document.getElementById('q-media-box'), q.qMedia);

      document.getElementById('q-answer-box').classList.remove('active');
      document.getElementById('q-answer-text').innerText = q.answer;
      renderMedia(document.getElementById('a-media-box'), q.aMedia);

      document.getElementById('modal-verdict-box').style.display = 'none';
      document.getElementById('modal-players-list').style.display = 'flex';
      document.getElementById('answering-team-label').style.display = 'block';
      renderModalPlayers();

      document.getElementById('modal-question').classList.add('active');

      if (!playedQuestions.includes(qKey)) {
        playedQuestions.push(qKey);
      }
    }

    function renderMedia(container, filename) {
      container.innerHTML = '';
      if (!filename) return;
      const lower = filename.toLowerCase().trim();
      if (lower.endsWith('.mp4') || lower.endsWith('.mov') || lower.endsWith('.webm')) {
        container.innerHTML = `<video src="${filename}" controls autoplay playsinline></video>`;
      } else if (lower.endsWith('.mp3') || lower.endsWith('.wav') || lower.endsWith('.ogg') || lower.endsWith('.m4a')) {
        container.innerHTML = `<audio src="${filename}" controls autoplay></audio>`;
      } else {
        container.innerHTML = `<img src="${filename}" alt="Медиа">`;
      }
    }

    function renderModalPlayers() {
      const list = document.getElementById('modal-players-list');
      list.innerHTML = '';
      gameTeams.forEach((t, idx) => {
        const btn = document.createElement('button');
        btn.className = 'player-btn' + (selectedTeamIdx === idx ? ' selected' : '');
        btn.innerText = t.name;
        if (lockedTeams.includes(idx)) btn.disabled = true;

        btn.onclick = () => {
          selectedTeamIdx = idx;
          renderModalPlayers();
          document.getElementById('modal-verdict-box').style.display = 'flex';
        };
        list.appendChild(btn);
      });
    }

    function judgeAnswer(isCorrect) {
      if (selectedTeamIdx === null) return;
      if (isCorrect) {
        gameTeams[selectedTeamIdx].score += activeQuestionCost;
        renderGameTeams();
        revealAnswer();
        document.getElementById('modal-verdict-box').style.display = 'none';
      } else {
        gameTeams[selectedTeamIdx].score -= activeQuestionCost;
        lockedTeams.push(selectedTeamIdx);
        selectedTeamIdx = null;
        renderGameTeams();
        document.getElementById('modal-verdict-box').style.display = 'none';
        renderModalPlayers();
        if (lockedTeams.length >= gameTeams.length) revealAnswer();
      }
    }

    function revealAnswer() {
      document.getElementById('q-answer-box').classList.add('active');
    }

    /* ПРОПУСК ВОПРОСА */
    function passQuestion() {
      revealAnswer();
      document.getElementById('modal-verdict-box').style.display = 'none';
      document.getElementById('modal-players-list').style.display = 'none';
      document.getElementById('answering-team-label').style.display = 'none';
    }

    function closeQuestion() {
      document.getElementById('modal-question').classList.remove('active');
      document.getElementById('q-media-box').innerHTML = '';
      document.getElementById('a-media-box').innerHTML = '';
      renderGameBoard();
    }

    /* РЕДАКТОР С АККОРДЕОНОМ */
    function updateEditorRoundSelect() {
      const sel = document.getElementById('editor-active-round-select');
      sel.innerHTML = '';
      if (!gamePack.rounds || gamePack.rounds.length === 0) {
        const opt = document.createElement('option');
        opt.innerText = 'Нет раундов';
        sel.appendChild(opt);
        return;
      }
      gamePack.rounds.forEach((r, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.innerText = r.name;
        if (idx === editorRoundIdx) opt.selected = true;
        sel.appendChild(opt);
      });
    }

    function switchEditorRound(idx) {
      editorRoundIdx = parseInt(idx) || 0;
      renderEditorActiveRound();
    }

    function addRoundToEditor() {
      const name = prompt("Введите название раунда (например: Раунд 1, Раунд 2 или Финал):", `Раунд ${gamePack.rounds.length + 1}`);
      if (!name) return;
      gamePack.rounds.push({ name: name, themes: [] });
      editorRoundIdx = gamePack.rounds.length - 1;
      updateEditorRoundSelect();
      renderEditorActiveRound();
    }

    function removeCurrentEditorRound() {
      if (gamePack.rounds.length === 0) return;
      if (confirm(`Удалить ${gamePack.rounds[editorRoundIdx].name}?`)) {
        gamePack.rounds.splice(editorRoundIdx, 1);
        if (editorRoundIdx >= gamePack.rounds.length) editorRoundIdx = Math.max(0, gamePack.rounds.length - 1);
        updateEditorRoundSelect();
        renderEditorActiveRound();
      }
    }

    function renderEditorActiveRound() {
      const container = document.getElementById('editor-themes-container');
      container.innerHTML = '';

      if (!gamePack.rounds || gamePack.rounds.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding:30px; color:#a0aec0;">Создайте раунд кнопкой <b>«➕ Добавить раунд»</b>.</div>`;
        return;
      }

      const round = gamePack.rounds[editorRoundIdx];
      if (!round) return;

      round.themes.forEach((th, tIdx) => {
        const themeKey = `r${editorRoundIdx}_t${tIdx}`;
        const isCollapsed = !!collapsedThemes[themeKey];

        const thBox = document.createElement('div');
        thBox.className = 'theme-accordion-box';

        thBox.innerHTML = `
          <div class="theme-header-row">
            <input type="text" value="${th.name}" oninput="gamePack.rounds[${editorRoundIdx}].themes[${tIdx}].name=this.value" style="font-weight:bold; color:var(--sv-gold); flex-grow:1;">
            <button class="btn btn-blue" onclick="toggleThemeCollapse('${themeKey}')">${isCollapsed ? '▶️ Развернуть' : '🔽 Скрыть вопросы'}</button>
            <button class="btn btn-red" onclick="removeThemeFromEditor(${tIdx})">✕</button>
          </div>
          <div id="theme-body-${themeKey}" style="display: ${isCollapsed ? 'none' : 'flex'}; flex-direction: column; gap:6px;">
            <button class="btn" style="align-self:flex-start; margin-top:4px;" onclick="addQuestionToTheme(${tIdx})">➕ Добавить вопрос</button>
            <div id="questions-list-${themeKey}"></div>
          </div>
        `;

        container.appendChild(thBox);

        const qList = thBox.querySelector(`#questions-list-${themeKey}`);
        th.questions.forEach((q, qIdx) => {
          const qBox = document.createElement('div');
          qBox.className = 'q-edit-box';

          qBox.innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <span style="color:var(--sv-gold); font-size:0.85rem;">ВОПРОС:</span>
              <button class="btn btn-red" style="padding:2px 6px; font-size:0.75rem;" onclick="removeQuestionFromTheme(${tIdx}, ${qIdx})">✕</button>
            </div>
            <div class="row-input">
              <label>Стоимость (баллы):</label>
              <input type="number" value="${q.cost}" oninput="gamePack.rounds[${editorRoundIdx}].themes[${tIdx}].questions[${qIdx}].cost=parseInt(this.value)||0">
            </div>
            <div class="row-input">
              <label>Текст вопроса:</label>
              <input type="text" value="${q.text}" oninput="gamePack.rounds[${editorRoundIdx}].themes[${tIdx}].questions[${qIdx}].text=this.value" placeholder="Вопрос">
            </div>
            <div class="row-input">
              <label>Медиа в вопрос:</label>
              <input type="text" value="${q.qMedia || ''}" oninput="gamePack.rounds[${editorRoundIdx}].themes[${tIdx}].questions[${qIdx}].qMedia=this.value.trim()" placeholder="photo.jpg или song.mp3">
            </div>
            <div class="row-input">
              <label>Правильный ответ:</label>
              <input type="text" value="${q.answer}" oninput="gamePack.rounds[${editorRoundIdx}].themes[${tIdx}].questions[${qIdx}].answer=this.value" placeholder="Ответ">
            </div>
            <div class="row-input">
              <label>Медиа в ответ:</label>
              <input type="text" value="${q.aMedia || ''}" oninput="gamePack.rounds[${editorRoundIdx}].themes[${tIdx}].questions[${qIdx}].aMedia=this.value.trim()" placeholder="photo_answer.jpg">
            </div>
          `;
          qList.appendChild(qBox);
        });
      });
    }

    function toggleThemeCollapse(key) {
      collapsedThemes[key] = !collapsedThemes[key];
      renderEditorActiveRound();
    }

    function addThemeToEditor() {
      if (!gamePack.rounds[editorRoundIdx]) return;
      gamePack.rounds[editorRoundIdx].themes.push({
        name: "НОВАЯ ТЕМА",
        questions: [
          { cost: 100, text: "", answer: "", qMedia: "", aMedia: "" },
          { cost: 200, text: "", answer: "", qMedia: "", aMedia: "" },
          { cost: 300, text: "", answer: "", qMedia: "", aMedia: "" },
          { cost: 400, text: "", answer: "", qMedia: "", aMedia: "" },
          { cost: 500, text: "", answer: "", qMedia: "", aMedia: "" }
        ]
      });
      renderEditorActiveRound();
    }

    function removeThemeFromEditor(tIdx) {
      gamePack.rounds[editorRoundIdx].themes.splice(tIdx, 1);
      renderEditorActiveRound();
    }

    function addQuestionToTheme(tIdx) {
      gamePack.rounds[editorRoundIdx].themes[tIdx].questions.push({
        cost: 100,
        text: "",
        answer: "",
        qMedia: "",
        aMedia: ""
      });
      renderEditorActiveRound();
    }

    function removeQuestionFromTheme(tIdx, qIdx) {
      gamePack.rounds[editorRoundIdx].themes[tIdx].questions.splice(qIdx, 1);
      renderEditorActiveRound();
    }

    function saveEditorLocally() {
      localStorage.setItem('svoyak_v7_pack', JSON.stringify(gamePack));
      alert("Пак сохранён в браузере!");
    }

    function exportPackFile() {
      saveEditorLocally();
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(gamePack, null, 2));
      const dl = document.createElement('a');
      dl.setAttribute("href", dataStr);
      dl.setAttribute("download", "svoyak_game_pack.json");
      dl.click();
    }
  </script>
</body>
</html>
