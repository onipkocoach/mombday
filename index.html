<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Своя Игра — Главная</title>
  <style>
    :root {
      --sv-blue: #001f5c;
      --sv-dark: #000c24;
      --sv-tile: #0a2f87;
      --sv-gold: #ffcc00;
      --sv-gold-hover: #ffe066;
      --sv-border: #1a4ab8;
      --danger: #d90429;
      --success: #008000;
      --text: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Arial Black', Impact, -apple-system, sans-serif; }
    body { background: var(--sv-dark); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; padding: 12px; }

    .btn { background: var(--sv-gold); color: #000; border: 2px solid #fff; border-radius: 6px; padding: 10px 18px; font-size: 1rem; font-weight: 900; cursor: pointer; text-transform: uppercase; transition: transform 0.1s; }
    .btn:hover { background: var(--sv-gold-hover); transform: scale(1.02); }
    .btn-blue { background: #1a4ab8; color: #fff; border-color: var(--sv-gold); }
    .btn-red { background: var(--danger); color: #fff; border-color: #fff; }
    .btn-green { background: var(--success); color: #fff; border-color: #fff; }
    .btn:disabled { opacity: 0.25; cursor: not-allowed; }

    /* Главный экран выбора */
    #view-main-menu { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; text-align: center; }
    .menu-title { font-size: 3rem; color: var(--sv-gold); text-shadow: 3px 3px 6px #000; text-transform: uppercase; }
    .menu-box { display: flex; flex-direction: column; gap: 16px; width: 100%; max-width: 400px; }
    .menu-btn { font-size: 1.4rem; padding: 18px; border-radius: 10px; }

    /* Экран настройки игры перед запуском */
    #view-lobby { display: none; flex-direction: column; align-items: center; justify-content: center; flex-grow: 1; gap: 18px; max-width: 600px; margin: 0 auto; width: 100%; }
    .lobby-card { background: var(--sv-blue); border: 2px solid var(--sv-gold); border-radius: 10px; padding: 20px; width: 100%; display: flex; flex-direction: column; gap: 14px; }

    /* Табло игры */
    #view-game { display: none; flex-direction: column; flex-grow: 1; gap: 8px; justify-content: space-between; }
    header { display: flex; justify-content: space-between; align-items: center; background: var(--sv-blue); border: 2px solid var(--sv-gold); border-radius: 8px; padding: 8px 16px; }
    .round-title { font-size: 1.4rem; color: var(--sv-gold); }
    
    #board-table { display: flex; flex-direction: column; gap: 6px; flex-grow: 1; justify-content: center; }
    .board-row { display: grid; grid-template-columns: 240px repeat(auto-fit, minmax(70px, 1fr)); gap: 6px; }
    .theme-cell { background: var(--sv-blue); border: 2px solid var(--sv-gold); border-radius: 6px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 8px; font-size: 1.1rem; color: #fff; text-transform: uppercase; }
    .price-cell { background: var(--sv-tile); border: 2px solid var(--sv-gold); border-radius: 6px; aspect-ratio: 16/9; min-height: 60px; display: flex; align-items: center; justify-content: center; font-size: 2rem; color: var(--sv-gold); cursor: pointer; text-shadow: 2px 2px 4px #000; }
    .price-cell:hover { background: #1342b3; transform: scale(1.02); }
    .price-cell.empty { background: #000814; border-color: #0b1d40; color: transparent; pointer-events: none; }

    #teams-bar { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .team-card { background: var(--sv-blue); border: 2px solid var(--sv-gold); border-radius: 6px; padding: 6px 16px; min-width: 150px; text-align: center; }
    .team-name { font-size: 0.95rem; }
    .team-score { font-size: 1.6rem; color: var(--sv-gold); }

    /* Модальное окно вопроса */
    #modal-question { display: none; position: fixed; inset: 0; background: var(--sv-dark); z-index: 1000; flex-direction: column; padding: 20px; align-items: center; justify-content: space-between; border: 4px solid var(--sv-gold); }
    #modal-question.active { display: flex; }
    .q-cost { font-size: 2.2rem; color: var(--sv-gold); }
    .q-body { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; max-width: 1100px; text-align: center; gap: 14px; }
    .q-text { font-size: 2rem; line-height: 1.3; font-family: Arial, sans-serif; }
    .media-holder { max-height: 44vh; max-width: 100%; display: flex; justify-content: center; }
    .media-holder img, .media-holder video { max-height: 44vh; max-width: 100%; border: 3px solid var(--sv-gold); border-radius: 8px; }
    .answer-box { display: none; background: #002878; border: 2px dashed var(--sv-gold); border-radius: 8px; padding: 12px 20px; width: 100%; }
    .answer-box.active { display: block; }

    .q-controls { background: var(--sv-blue); border: 2px solid var(--sv-border); border-radius: 8px; padding: 10px; width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 8px; align-items: center; }
    .players-list { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .player-btn { background: #0a2f87; color: #fff; border: 2px solid var(--sv-gold); padding: 8px 14px; border-radius: 6px; font-size: 1rem; cursor: pointer; }
    .player-btn.selected { background: var(--sv-gold); color: #000; }
    .player-btn:disabled { opacity: 0.2; text-decoration: line-through; cursor: not-allowed; }

    /* Экран Редактора */
    #view-editor { display: none; flex-direction: column; gap: 16px; max-width: 1050px; margin: 0 auto; width: 100%; padding-bottom: 50px; }
    .editor-header { display: flex; justify-content: space-between; align-items: center; background: var(--sv-blue); padding: 12px 16px; border-radius: 8px; border: 2px solid var(--sv-gold); }
    .round-editor-card { background: var(--sv-blue); border: 2px solid var(--sv-border); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
    .theme-editor-card { background: #09173b; border: 1px solid var(--sv-gold); border-radius: 6px; padding: 12px; display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
    .q-editor-card { background: #050d24; border-left: 4px solid var(--sv-gold); padding: 10px; border-radius: 4px; display: flex; flex-direction: column; gap: 6px; }
    
    .row-input { display: grid; grid-template-columns: 140px 1fr; gap: 8px; align-items: center; }
    .row-input label { font-size: 0.85rem; color: var(--sv-gold); font-family: Arial, sans-serif; }
    input { background: #000c24; border: 1px solid var(--sv-border); color: #fff; padding: 8px; border-radius: 4px; font-size: 1rem; font-family: Arial, sans-serif; }

    @media (max-width: 800px) {
      .board-row { grid-template-columns: 110px repeat(auto-fit, minmax(50px, 1fr)); }
      .theme-cell { font-size: 0.75rem; padding: 4px; }
      .price-cell { font-size: 1.1rem; min-height: 45px; }
      .q-text { font-size: 1.3rem; }
      .row-input { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- 1. ГЛАВНОЕ МЕНЮ (ПРИ ВХОДЕ) -->
  <section id="view-main-menu">
    <h1 class="menu-title">Своя Игра 💖</h1>
    <div class="menu-box">
      <button class="btn menu-btn" onclick="openLobby()">🎮 Играть</button>
      <button class="btn btn-blue menu-btn" onclick="openEditor()">⚙️ Редактор пака</button>
    </div>
  </section>

  <!-- 2. ЛОББИ (ВЫБОР ФАЙЛА И КОМАНД ПЕРЕД ИГРОЙ) -->
  <section id="view-lobby">
    <div class="lobby-card">
      <h2 style="color:var(--sv-gold);">Подготовка к игре</h2>
      
      <div>
        <label style="font-size:0.9rem; color:#a0aec0; display:block; margin-bottom:4px;">1. Выберите файл игры (.json):</label>
        <input type="file" id="lobby-file-input" accept=".json" style="width:100%; cursor:pointer;">
        <div style="margin-top:6px; font-size:0.85rem; color:#ffcc00;" id="pack-status-label">Либо будет использован текущий сохранённый пак</div>
      </div>

      <div>
        <label style="font-size:0.9rem; color:#a0aec0; display:block; margin-bottom:4px;">2. Настройка команд:</label>
        <div style="display:flex; gap:8px;">
          <input type="text" id="lobby-team-input" placeholder="Имя команды" style="flex-grow:1;">
          <button class="btn" onclick="addLobbyTeam()">Добавить</button>
        </div>
        <div id="lobby-teams-list" style="display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;"></div>
      </div>

      <div style="display:flex; gap:10px; margin-top:10px;">
        <button class="btn btn-green" onclick="startPlayGame()" style="flex-grow:1; padding:14px; font-size:1.1rem;">🚀 НАЧАТЬ ИГРУ</button>
        <button class="btn btn-red" onclick="returnToMainMenu()">Назад</button>
      </div>
    </div>
  </section>

  <!-- 3. ЭКРАН САМОЙ ИГРЫ -->
  <section id="view-game">
    <header>
      <div class="round-title" id="game-round-title">РАУНД 1</div>
      <div style="display:flex; gap:8px;">
        <button class="btn btn-blue" id="btn-next-round" onclick="nextRound()">Следующий раунд ➡️</button>
        <button class="btn btn-red" onclick="exitGame()">Выход в меню</button>
      </div>
    </header>

    <div id="board-table"></div>
    <div id="teams-bar"></div>
  </section>

  <!-- МОДАЛЬНОЕ ОКНО ВОПРОСА -->
  <div id="modal-question">
    <div class="q-cost" id="q-cost-display">100 БАЛЛОВ</div>

    <div class="q-body">
      <div class="q-text" id="q-text-display">Вопрос</div>
      <div class="media-holder" id="q-media-box"></div>

      <div class="answer-box" id="q-answer-box">
        <div style="color:var(--sv-gold); font-size:1.1rem; margin-bottom:4px;">ПРАВИЛЬНЫЙ ОТВЕТ:</div>
        <div style="font-size:1.7rem; font-family:Arial,sans-serif;" id="q-answer-text">Ответ</div>
        <div class="media-holder" id="a-media-box" style="margin-top:8px;"></div>
      </div>
    </div>

    <div class="q-controls">
      <div style="font-size:0.9rem; color:var(--sv-gold);">КТО ОТВЕЧАЕТ:</div>
      <div class="players-list" id="modal-players-list"></div>

      <div id="modal-verdict-box" style="display:none; gap:10px; margin-top:6px;">
        <button class="btn btn-green" onclick="judgeAnswer(true)">✅ ВЕРНО (+БАЛЛЫ)</button>
        <button class="btn btn-red" onclick="judgeAnswer(false)">❌ НЕВЕРНО (-БАЛЛЫ)</button>
      </div>

      <div style="display:flex; gap:8px; margin-top:6px;">
        <button class="btn btn-blue" onclick="revealAnswer()">👀 ПОКАЗАТЬ ОТВЕТ</button>
        <button class="btn" onclick="passQuestion()">⏭️ ПРОПУСК</button>
        <button class="btn btn-blue" onclick="closeQuestion()">ЗАКРЫТЬ ВОПРОС</button>
      </div>
    </div>
  </div>

  <!-- 4. ВИЗУАЛЬНЫЙ РЕДАКТОР ПАКА -->
  <section id="view-editor">
    <div class="editor-header">
      <h2 style="color:var(--sv-gold);">Редактор пака игры</h2>
      <div style="display:flex; gap:8px;">
        <button class="btn btn-green" onclick="exportPackFile()">💾 Скачать пак (.json)</button>
        <button class="btn btn-red" onclick="returnToMainMenu()">Выйти в меню</button>
      </div>
    </div>

    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:8px;">
      <button class="btn" onclick="addRoundToEditor()">➕ ДОБАВИТЬ РАУНД</button>
      <button class="btn btn-blue" onclick="saveEditorLocally()">Сохранить в браузере</button>
    </div>

    <div id="editor-rounds-container"></div>
  </section>

  <script>
    // Шаблон игры по умолчанию (если ещё ничего не создано)
    let currentPack = {
      rounds: []
    };

    let teams = [
      { name: "Команда 1", score: 0 },
      { name: "Команда 2", score: 0 }
    ];

    let currentRoundIdx = 0;
    let playedQuestions = [];
    let activeQuestionCost = 0;
    let selectedTeamIdx = null;
    let lockedTeams = [];

    // Инициализация при старте
    function init() {
      const savedPack = localStorage.getItem('svoyak_custom_pack');
      if (savedPack) {
        try { currentPack = JSON.parse(savedPack); } catch(e){}
      }
      const savedTeams = localStorage.getItem('svoyak_custom_teams');
      if (savedTeams) {
        try { teams = JSON.parse(savedTeams); } catch(e){}
      }
      renderLobbyTeams();
    }

    /* Навигация экранов */
    function showScreen(id) {
      document.getElementById('view-main-menu').style.display = 'none';
      document.getElementById('view-lobby').style.display = 'none';
      document.getElementById('view-game').style.display = 'none';
      document.getElementById('view-editor').style.display = 'none';
      document.getElementById(id).style.display = 'flex';
      if (id === 'view-editor') document.getElementById(id).style.display = 'flex';
    }

    function returnToMainMenu() {
      showScreen('view-main-menu');
    }

    function openLobby() {
      showScreen('view-lobby');
      renderLobbyTeams();
    }

    /* Лобби и загрузка пака */
    function renderLobbyTeams() {
      const list = document.getElementById('lobby-teams-list');
      list.innerHTML = '';
      teams.forEach((t, idx) => {
        const item = document.createElement('span');
        item.style.background = '#0a2f87';
        item.style.border = '1px solid var(--sv-gold)';
        item.style.padding = '4px 10px';
        item.style.borderRadius = '4px';
        item.innerHTML = `${t.name} <b style="color:red; cursor:pointer; margin-left:6px;" onclick="removeLobbyTeam(${idx})">&times;</b>`;
        list.appendChild(item);
      });
    }

    function addLobbyTeam() {
      const inp = document.getElementById('lobby-team-input');
      const val = inp.value.trim();
      if (!val) return;
      teams.push({ name: val, score: 0 });
      inp.value = '';
      localStorage.setItem('svoyak_custom_teams', JSON.stringify(teams));
      renderLobbyTeams();
    }

    function removeLobbyTeam(idx) {
      teams.splice(idx, 1);
      localStorage.setItem('svoyak_custom_teams', JSON.stringify(teams));
      renderLobbyTeams();
    }

    document.getElementById('lobby-file-input').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const loaded = JSON.parse(evt.target.result);
          if (loaded.rounds) {
            currentPack = loaded;
            localStorage.setItem('svoyak_custom_pack', JSON.stringify(currentPack));
            document.getElementById('pack-status-label').innerText = `✅ Загружен пак: "${file.name}" (${currentPack.rounds.length} раунд.)`;
          }
        } catch(err) {
          alert('Ошибка чтения JSON файла!');
        }
      };
      reader.readAsText(file);
    });

    function startPlayGame() {
      if (!currentPack.rounds || currentPack.rounds.length === 0) {
        alert("В паке нет раундов! Сначала откройте Редактор и создайте раунды с вопросами.");
        return;
      }
      if (teams.length === 0) {
        alert("Добавьте хотя бы одну команду!");
        return;
      }
      currentRoundIdx = 0;
      playedQuestions = [];
      teams.forEach(t => t.score = 0);
      showScreen('view-game');
      renderGameBoard();
      renderGameTeams();
    }

    /* Игровое табло */
    function renderGameBoard() {
      const table = document.getElementById('board-table');
      table.innerHTML = '';

      const round = currentPack.rounds[currentRoundIdx];
      if (!round) return;

      document.getElementById('game-round-title').innerText = round.name;

      round.themes.forEach((theme, tIdx) => {
        const row = document.createElement('div');
        row.className = 'board-row';

        const tCell = document.createElement('div');
        tCell.className = 'theme-cell';
        tCell.innerText = theme.name;
        row.appendChild(tCell);

        theme.questions.forEach((q, qIdx) => {
          const qCell = document.createElement('div');
          const qKey = `r${currentRoundIdx}_t${tIdx}_q${qIdx}`;
          const isPlayed = playedQuestions.includes(qKey);

          qCell.className = 'price-cell' + (isPlayed ? ' empty' : '');
          qCell.innerText = isPlayed ? '' : q.cost;

          if (!isPlayed) {
            qCell.onclick = () => openQuestion(tIdx, qIdx, qKey);
          }
          row.appendChild(qCell);
        });

        table.appendChild(row);
      });

      // Кнопка следующего раунда
      const nextBtn = document.getElementById('btn-next-round');
      if (currentRoundIdx < currentPack.rounds.length - 1) {
        nextBtn.style.display = 'block';
        nextBtn.innerText = `Перейти: ${currentPack.rounds[currentRoundIdx + 1].name} ➡️`;
      } else {
        nextBtn.style.display = 'none';
      }
    }

    function nextRound() {
      if (currentRoundIdx < currentPack.rounds.length - 1) {
        currentRoundIdx++;
        renderGameBoard();
      }
    }

    function renderGameTeams() {
      const bar = document.getElementById('teams-bar');
      bar.innerHTML = '';
      teams.forEach(t => {
        const c = document.createElement('div');
        c.className = 'team-card';
        c.innerHTML = `<div class="team-name">${t.name}</div><div class="team-score">${t.score}</div>`;
        bar.appendChild(c);
      });
    }

    function exitGame() {
      if (confirm("Выйти в главное меню? Текущий счёт будет сброшен.")) {
        returnToMainMenu();
      }
    }

    /* Окно вопроса */
    function openQuestion(tIdx, qIdx, qKey) {
      const q = currentPack.rounds[currentRoundIdx].themes[tIdx].questions[qIdx];
      activeQuestionCost = q.cost;
      selectedTeamIdx = null;
      lockedTeams = [];

      document.getElementById('q-cost-display').innerText = `${q.cost} БАЛЛОВ`;
      document.getElementById('q-text-display').innerText = q.text;

      // Медиа вопроса
      renderMedia(document.getElementById('q-media-box'), q.qMedia);

      // Ответ
      document.getElementById('q-answer-box').classList.remove('active');
      document.getElementById('q-answer-text').innerText = q.answer;
      renderMedia(document.getElementById('a-media-box'), q.aMedia);

      document.getElementById('modal-verdict-box').style.display = 'none';
      renderModalPlayers();

      document.getElementById('modal-question').classList.add('active');

      if (!playedQuestions.includes(qKey)) {
        playedQuestions.push(qKey);
      }
    }

    function renderMedia(container, filename) {
      container.innerHTML = '';
      if (!filename) return;
      const lower = filename.toLowerCase().trim();
      if (lower.endsWith('.mp4') || lower.endsWith('.mov') || lower.endsWith('.webm')) {
        container.innerHTML = `<video src="${filename}" controls autoplay playsinline></video>`;
      } else if (lower.endsWith('.mp3') || lower.endsWith('.wav') || lower.endsWith('.ogg') || lower.endsWith('.m4a')) {
        container.innerHTML = `<audio src="${filename}" controls autoplay></audio>`;
      } else {
        container.
