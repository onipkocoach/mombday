<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Своя Игра — С Днём Рождения, Мама!</title>
  <style>
    :root {
      --bg: #0b132b;
      --card-bg: #1c2541;
      --accent: #fca311;
      --text: #ffffff;
      --border: #3a506b;
      --danger: #e63946;
      --success: #2a9d8f;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 14px; min-height: 100vh; display: flex; flex-direction: column; }
    
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
    h1 { font-size: 1.4rem; color: var(--accent); }
    .btn { background: var(--accent); color: #000; border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 0.95rem; }
    .btn:hover { opacity: 0.9; }
    .btn-secondary { background: var(--border); color: #fff; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-success { background: var(--success); color: #fff; }
    .btn:disabled { opacity: 0.3; cursor: not-allowed; }

    /* Раунды */
    .round-tabs { display: flex; gap: 8px; margin-bottom: 12px; overflow-x: auto; padding-bottom: 4px; }
    .round-btn { padding: 8px 14px; background: var(--card-bg); border: 2px solid var(--border); color: #fff; border-radius: 6px; cursor: pointer; font-weight: bold; white-space: nowrap; }
    .round-btn.active { border-color: var(--accent); background: #2a3c66; color: var(--accent); }

    /* Табло */
    #board-view { flex-grow: 1; display: flex; flex-direction: column; gap: 12px; }
    .grid-wrap { display: flex; flex-direction: column; gap: 8px; }
    .category-row { display: grid; grid-template-columns: 200px repeat(auto-fit, minmax(75px, 1fr)); gap: 8px; }
    .category-title { background: #1f3160; display: flex; align-items: center; justify-content: center; text-align: center; font-weight: bold; padding: 8px; border-radius: 8px; border: 1px solid var(--border); font-size: 1rem; }
